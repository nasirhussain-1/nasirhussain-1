<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Syed Nasir Hussain: Founder, AI Product Builder, Computer Systems Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03010A"/>
      <stop offset=".55" stop-color="#0E0522"/>
      <stop offset="1" stop-color="#1D0B40"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F3FF"/>
      <stop offset=".5" stop-color="#FFE3F1"/>
      <stop offset="1" stop-color="#FFEFC9"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="48" y1="0" x2="548" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#E4CFFF"/>
      <stop offset="1" stop-color="#FF8AC7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9D4EDD"/>
      <stop offset=".5" stop-color="#FF2E97"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A0F5C"/>
      <stop offset="1" stop-color="#C0278F"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity=".05"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="36 36" dur="6s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="300" rx="22"/></clipPath>
    <clipPath id="band"><polygon points="640,0 1000,0 1000,300 520,300"/></clipPath>
    <clipPath id="nameReveal">
      <rect x="0" y="80" width="0" height="90">
        <animate attributeName="width" from="0" to="1000" dur="1.4s" begin="0.3s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="subReveal">
      <rect x="0" y="180" width="0" height="34">
        <animate attributeName="width" from="0" to="1000" dur="1.8s" begin="1.9s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- DARK SIDE -->
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <!-- drifting aurora glows -->
    <g filter="url(#blur)">
      <circle cx="140" cy="260" r="120" fill="#9D4EDD" opacity=".55">
        <animate attributeName="cx" values="140;300;140" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="260;220;260" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="420" cy="30" r="100" fill="#FF2E97" opacity=".38">
        <animate attributeName="cx" values="420;250;420" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle cx="560" cy="290" r="90" fill="#FF9F1C" opacity=".25">
        <animate attributeName="cy" values="290;240;290" dur="11s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- rising particles -->
    <g fill="#FFFFFF">
      <circle cx="70" cy="290" r="1.6"><animate attributeName="cy" values="300;10" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="290" r="1.2"><animate attributeName="cy" values="300;10" dur="12s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="12s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="290" r="2"><animate attributeName="cy" values="300;10" dur="10s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="10s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="290" r="1.3"><animate attributeName="cy" values="300;10" dur="13s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="13s" begin="4s" repeatCount="indefinite"/></circle>
      <circle cx="410" cy="290" r="1.8"><animate attributeName="cy" values="300;10" dur="8s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="8s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="490" cy="290" r="1.4"><animate attributeName="cy" values="300;10" dur="11s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="11s" begin="5s" repeatCount="indefinite"/></circle>
      <circle cx="570" cy="290" r="1.7"><animate attributeName="cy" values="300;10" dur="14s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="14s" begin="1.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- LIGHT SIDE -->
    <g clip-path="url(#band)">
      <polygon points="640,0 1000,0 1000,300 520,300" fill="url(#light)"/>

      <!-- soft sweeping shine -->
      <g>
        <animateTransform attributeName="transform" type="translate" from="-400 0" to="1000 0" dur="7s" repeatCount="indefinite"/>
        <rect x="640" y="-40" width="70" height="400" fill="#FFFFFF" opacity=".45" transform="skewX(-20)"/>
      </g>

      <!-- orbit rings -->
      <g fill="none" stroke="#2A0F5C">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 800 150" to="360 800 150" dur="40s" repeatCount="indefinite"/>
          <circle cx="800" cy="150" r="50" stroke-opacity=".30" stroke-dasharray="3 6"/>
          <circle cx="800" cy="150" r="118" stroke-opacity=".16"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360 800 150" to="0 800 150" dur="55s" repeatCount="indefinite"/>
          <circle cx="800" cy="150" r="84" stroke-opacity=".24" stroke-dasharray="10 8"/>
        </g>
      </g>

      <!-- orbiting dots -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 800 150" to="360 800 150" dur="7s" repeatCount="indefinite"/>
        <circle cx="850" cy="150" r="5" fill="#FF2E97"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360 800 150" to="0 800 150" dur="11s" repeatCount="indefinite"/>
        <circle cx="884" cy="150" r="6" fill="#9D4EDD"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 800 150" to="360 800 150" dur="16s" repeatCount="indefinite"/>
        <circle cx="918" cy="150" r="5" fill="#FF9F1C"/>
        <circle cx="682" cy="150" r="4" fill="#2A0F5C"/>
      </g>

      <!-- center emblem -->
      <circle cx="800" cy="150" r="58" fill="url(#halo)">
        <animate attributeName="r" values="52;66;52" dur="4s" repeatCount="indefinite"/>
      </circle>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" repeatCount="indefinite"/>
        <text x="800" y="166" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="46" font-weight="800" fill="url(#ink)">&lt;/&gt;</text>
      </g>

      <text x="800" y="284" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="11" fill="#2A0F5C" fill-opacity=".75" textLength="270" lengthAdjust="spacing">AI · WEB · EMBEDDED · ROBOTICS</text>
    </g>

    <!-- glowing diagonal seam -->
    <line x1="640" y1="0" x2="520" y2="300" stroke="url(#accent)" stroke-width="6" opacity=".7" filter="url(#soft)"/>
    <line x1="640" y1="0" x2="520" y2="300" stroke="url(#accent)" stroke-width="3"/>
    <line x1="640" y1="0" x2="520" y2="300" stroke="#FFFFFF" stroke-width="3" pathLength="300" stroke-dasharray="26 274">
      <animate attributeName="stroke-dashoffset" from="300" to="0" dur="3.2s" repeatCount="indefinite"/>
    </line>

    <!-- TEXT -->
    <text x="48" y="68" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="14" letter-spacing="3" fill="#FF8AC7" opacity="0">
      // HELLO WORLD, I'M
      <animate attributeName="opacity" from="0" to="1" dur=".8s" begin=".1s" fill="freeze"/>
    </text>

    <g clip-path="url(#nameReveal)">
      <text x="48" y="140" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="800" textLength="500" lengthAdjust="spacingAndGlyphs" fill="#FF2E97" opacity=".4" filter="url(#soft)">SYED NASIR HUSSAIN</text>
      <text x="48" y="140" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="800" textLength="500" lengthAdjust="spacingAndGlyphs" fill="url(#name)">SYED NASIR HUSSAIN</text>
    </g>

    <rect x="48" y="156" width="0" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="width" from="0" to="150" dur=".9s" begin="1.5s" fill="freeze"/>
    </rect>

    <g clip-path="url(#subReveal)">
      <text x="48" y="200" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="13.5" fill="#CDBBF7" textLength="490" lengthAdjust="spacing">FOUNDER · AI PRODUCT BUILDER · COMPUTER SYSTEMS ENGINEER</text>
    </g>
    <rect x="48" y="187" width="8" height="18" fill="#FF9F1C" opacity="0">
      <set attributeName="opacity" to="1" begin="1.9s"/>
      <animate attributeName="x" from="48" to="538" dur="1.8s" begin="1.9s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3.8s" repeatCount="indefinite"/>
    </rect>

    <!-- status pills -->
    <g>
      <rect x="48" y="232" width="216" height="30" rx="15" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".2"/>
      <circle cx="68" cy="247" r="4" fill="#3DFFA2"/>
      <circle cx="68" cy="247" r="4" fill="#3DFFA2">
        <animate attributeName="r" values="4;11" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".7;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="84" y="251" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="11.5" fill="#E4D6FF" textLength="168" lengthAdjust="spacing">OPEN TO COLLABORATE</text>

      <rect x="278" y="232" width="190" height="30" rx="15" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".2"/>
      <circle cx="298" cy="247" r="4" fill="#FF9F1C"/>
      <circle cx="298" cy="247" r="4" fill="#FF9F1C">
        <animate attributeName="r" values="4;11" dur="2s" begin=".7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".7;0" dur="2s" begin=".7s" repeatCount="indefinite"/>
      </circle>
      <text x="314" y="251" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="11.5" fill="#E4D6FF" textLength="142" lengthAdjust="spacing">BUILDING CLEARPORT</text>
    </g>
  </g>
</svg>
