<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="About Syed Nasir Hussain: solo founder of ClearPort, CSE student at MUET, builder of AI, full-stack and embedded projects" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .fu { opacity: 0; animation: fu .9s ease-out forwards; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .8s; }
    .d4 { animation-delay: 1.1s; } .d5 { animation-delay: 1.4s; } .d6 { animation-delay: 1.7s; } .d7 { animation-delay: 2s; }
    @keyframes fu { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .fl { animation: fl 3.6s ease-in-out infinite alternate; }
    .fl2 { animation-delay: -1.2s; } .fl3 { animation-delay: -2.4s; }
    @keyframes fl { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    .sans { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: Consolas,'SFMono-Regular','Courier New',monospace; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05020F"/>
      <stop offset=".6" stop-color="#0E0522"/>
      <stop offset="1" stop-color="#1B0A3B"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F3FF"/>
      <stop offset=".5" stop-color="#FFE3F1"/>
      <stop offset="1" stop-color="#FFEFC9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9D4EDD"/>
      <stop offset=".5" stop-color="#FF2E97"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="head" gradientUnits="userSpaceOnUse" x1="44" y1="0" x2="420" y2="0">
      <stop offset="0" stop-color="#FFD9EE"/>
      <stop offset=".5" stop-color="#FF4FA6"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="card"><rect x="6" y="6" width="988" height="408" rx="26"/></clipPath>
    <clipPath id="panel"><polygon points="720,0 1000,0 1000,420 600,420"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- DARK SIDE -->
    <rect width="1000" height="420" fill="url(#bg)"/>
    <rect width="1000" height="420" fill="url(#grid)"/>
    <g filter="url(#blur)">
      <circle cx="120" cy="380" r="110" fill="#9D4EDD" opacity=".5">
        <animate attributeName="cx" values="120;280;120" dur="15s" repeatCount="indefinite"/>
      </circle>
      <circle cx="430" cy="40" r="90" fill="#FF2E97" opacity=".32">
        <animate attributeName="cx" values="430;260;430" dur="18s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- LIGHT SIDE -->
    <g clip-path="url(#panel)">
      <polygon points="720,0 1000,0 1000,420 600,420" fill="url(#light)"/>
      <g>
        <animateTransform attributeName="transform" type="translate" from="-300 0" to="1100 0" dur="8s" repeatCount="indefinite"/>
        <rect x="640" y="-40" width="60" height="500" fill="#FFFFFF" opacity=".45" transform="skewX(-20)"/>
      </g>

      <g fill="none" stroke="#2A0F5C">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 835 210" to="360 835 210" dur="45s" repeatCount="indefinite"/>
          <circle cx="835" cy="210" r="50" stroke-opacity=".30" stroke-dasharray="3 6"/>
          <circle cx="835" cy="210" r="112" stroke-opacity=".18"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360 835 210" to="0 835 210" dur="60s" repeatCount="indefinite"/>
          <circle cx="835" cy="210" r="82" stroke-opacity=".26" stroke-dasharray="10 8"/>
        </g>
      </g>

      <!-- orbit 1: AI -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 835 210" to="360 835 210" dur="9s" repeatCount="indefinite"/>
        <g transform="translate(885 210)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="9s" repeatCount="indefinite"/>
            <rect x="-18" y="-10" width="36" height="20" rx="10" fill="#FF2E97"/>
            <text y="4" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#FFFFFF">AI</text>
          </g>
        </g>
      </g>

      <!-- orbit 2: WEB -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360 835 210" to="0 835 210" dur="14s" repeatCount="indefinite"/>
        <g transform="translate(917 210)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
            <rect x="-24" y="-10" width="48" height="20" rx="10" fill="#9D4EDD"/>
            <text y="4" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#FFFFFF">WEB</text>
          </g>
        </g>
      </g>

      <!-- orbit 2b: ROBOTICS -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="180 835 210" to="540 835 210" dur="14s" repeatCount="indefinite"/>
        <g transform="translate(917 210)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="14s" repeatCount="indefinite"/>
            <rect x="-40" y="-10" width="80" height="20" rx="10" fill="#FF9F1C"/>
            <text y="4" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#2A0F5C">ROBOTICS</text>
          </g>
        </g>
      </g>

      <!-- orbit 3: EMBEDDED -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 835 210" to="360 835 210" dur="20s" repeatCount="indefinite"/>
        <g transform="translate(947 210)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="20s" repeatCount="indefinite"/>
            <rect x="-42" y="-10" width="84" height="20" rx="10" fill="#120A2A"/>
            <text y="4" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#FFFFFF">EMBEDDED</text>
          </g>
        </g>
      </g>

      <!-- core -->
      <circle cx="835" cy="210" r="44" fill="url(#halo)">
        <animate attributeName="r" values="38;54;38" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="835" cy="210" r="32" fill="#120A2A" stroke="url(#accent)" stroke-width="3"/>
      <text x="835" y="217" text-anchor="middle" class="sans" font-size="21" font-weight="800" fill="#FFFFFF">NH</text>

      <text x="835" y="384" text-anchor="middle" class="mono" font-size="11" fill="#2A0F5C" fill-opacity=".75" textLength="260" lengthAdjust="spacing">FOUNDER · STUDENT · BUILDER</text>
    </g>

    <!-- diagonal seam -->
    <line x1="720" y1="0" x2="600" y2="420" stroke="url(#accent)" stroke-width="6" opacity=".7" filter="url(#soft)"/>
    <line x1="720" y1="0" x2="600" y2="420" stroke="url(#accent)" stroke-width="3"/>
    <line x1="720" y1="0" x2="600" y2="420" stroke="#FFFFFF" stroke-width="3" pathLength="300" stroke-dasharray="26 274">
      <animate attributeName="stroke-dashoffset" from="300" to="0" dur="3.6s" repeatCount="indefinite"/>
    </line>

    <!-- TEXT -->
    <g class="fu d1">
      <text x="44" y="66" class="mono" font-size="13" letter-spacing="4" fill="#FF8AC7">ABOUT ME</text>
    </g>
    <rect x="152" y="60" width="0" height="2" rx="1" fill="url(#accent)">
      <animate attributeName="width" from="0" to="120" dur="1s" begin=".6s" fill="freeze"/>
    </rect>

    <g class="fu d2">
      <text x="44" y="116" class="sans" font-size="36" font-weight="800" fill="#FFFFFF">Turning ideas into</text>
    </g>
    <g class="fu d3">
      <text x="44" y="158" class="sans" font-size="36" font-weight="800" fill="url(#head)">products that ship.</text>
    </g>

    <g class="fu d4">
      <text x="44" y="204" class="sans" font-size="17" fill="#CFC3F2">Solo founder of <tspan font-weight="700" fill="#FFFFFF">ClearPort</tspan>, AI that automates customs</text>
      <text x="44" y="230" class="sans" font-size="17" fill="#CFC3F2">paperwork for U.S. brokers and freight forwarders.</text>
    </g>
    <g class="fu d5">
      <text x="44" y="268" class="sans" font-size="17" fill="#CFC3F2">I own business, architecture and product, <tspan font-weight="700" fill="#FF9F1C">end to end</tspan>.</text>
    </g>
    <g class="fu d6">
      <text x="44" y="306" class="sans" font-size="17" fill="#CFC3F2">CSE student at <tspan font-weight="700" fill="#FFFFFF">MUET</tspan> with roots in OOP, Java, C++ and</text>
      <text x="44" y="332" class="sans" font-size="17" fill="#CFC3F2">electronics, now shipping <tspan font-weight="700" fill="#FF8AC7">AI</tspan>, full-stack and robotics.</text>
    </g>

    <!-- floating chips -->
    <g class="fu d7">
      <g transform="translate(44 358)">
        <g class="fl">
          <rect width="170" height="30" rx="15" fill="#FFFFFF" fill-opacity=".06" stroke="#9D4EDD" stroke-opacity=".8"/>
          <circle cx="16" cy="15" r="4" fill="#9D4EDD"/>
          <text x="28" y="19.5" class="mono" font-size="11" fill="#E4D6FF" textLength="130" lengthAdjust="spacing">FOUNDER · CLEARPORT</text>
        </g>
      </g>
      <g transform="translate(226 358)">
        <g class="fl fl2">
          <rect width="170" height="30" rx="15" fill="#FFFFFF" fill-opacity=".06" stroke="#FF2E97" stroke-opacity=".8"/>
          <circle cx="16" cy="15" r="4" fill="#FF2E97"/>
          <text x="28" y="19.5" class="mono" font-size="11" fill="#E4D6FF" textLength="130" lengthAdjust="spacing">CSE · MUET JAMSHORO</text>
        </g>
      </g>
      <g transform="translate(408 358)">
        <g class="fl fl3">
          <rect width="148" height="30" rx="15" fill="#FFFFFF" fill-opacity=".06" stroke="#FF9F1C" stroke-opacity=".8"/>
          <circle cx="16" cy="15" r="4" fill="#FF9F1C"/>
          <text x="28" y="19.5" class="mono" font-size="11" fill="#E4D6FF" textLength="108" lengthAdjust="spacing">OOP · JAVA · C++</text>
        </g>
      </g>
    </g>
  </g>

  <!-- frame + travelling light streak -->
  <rect x="6" y="6" width="988" height="408" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity=".1" stroke-width="2"/>
  <rect x="6" y="6" width="988" height="408" rx="26" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" pathLength="1000" stroke-dasharray="140 860">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
